<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Buscar contacto</title>
</head>
<body class="bg-gradient-to-t from-slate-100 to-slate-900 m-12">
    <div class="flex flex-col bg-black bg-opacity-70 rounded-lg shadow-md items-center mx-2 sm:mx-12 md:mx-24 lg:mx-96 xl:mx-80 p-4 rounded-xl">
        <h1 class="text-3xl font-bold mb-8 text-white text-center pt-6">Buscar Contactos</h1>
        <form class="items-center space-y-2 w-full" method="POST" action="{{ url_for('search') }}">

            <div class="flex items-center mb-4">
                <label for="name" class="w-40 text-md text-white font-semibold">Nombre del contacto a buscar:</label>
                <input class="border border-neutral-400 w-full p-1" type="text" name="name" id="name" required />
            </div>

            <div class="flex">
                <button class="bg-neutral-800 text-white hover:scale-105 border border-black px-2 py-1 rounded-lg mt-6" type="submit">Buscar contacto</button>
            </div>
        </form>

        <a class="text-white hover:underline" href="{{ url_for('index') }}">Volver al inicio</a>
    </div>
</body>
</html>
